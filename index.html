<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator HPP & Profit OIS Grafika Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        /* Hide scrollbar for number input */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- DATA PRESET (Sesuai File CSV) ---
        const PRESETS = {
            LANYARD: {
                name: "Lanyard / Tali ID Card",
                components: [
                    { name: "Tali Tissue/Polyester", cost: 1125 },
                    { name: "Kertas Sublim (per pcs)", cost: 210 },
                    { name: "Tinta Sublim (per pcs)", cost: 140 },
                    { name: "Stopper", cost: 200 },
                    { name: "Pengait", cost: 700 },
                    { name: "Paku Keling", cost: 82 },
                    { name: "Listrik/Operasional", cost: 150 }
                ]
            },
            PIN: {
                name: "Pin (Peniti/Ganci)",
                components: [
                    { name: "Kaleng/Material Pin", cost: 1200 },
                    { name: "Kertas Inkjet (per pcs)", cost: 144 },
                    { name: "Tinta (per pcs)", cost: 50 },
                    { name: "Laminasi (per pcs)", cost: 100 },
                    { name: "Listrik/Mesin Press", cost: 50 }
                ]
            },
            IDCARD: {
                name: "PVC ID Card",
                components: [
                    { name: "Bahan PVC Blank", cost: 1000 },
                    { name: "Tinta (per kartu)", cost: 500 },
                    { name: "Listrik/Laminator", cost: 100 },
                    { name: "Casing/Holder (Opsional)", cost: 0 },
                    { name: "Yoyo/Tali (Opsional)", cost: 0 }
                ]
            },
            MEDALI: {
                name: "Medali Akrilik/Wisuda",
                components: [
                    { name: "Bahan Akrilik", cost: 1500 },
                    { name: "Sticker + Print", cost: 500 },
                    { name: "Resin (Jika pakai)", cost: 0 },
                    { name: "Tali Medali", cost: 1800 },
                    { name: "Ring/Pengait", cost: 200 }
                ]
            },
            CUSTOM: {
                name: "Kustom / Lainnya",
                components: [
                    { name: "Bahan Baku Utama", cost: 0 },
                    { name: "Biaya Cetak", cost: 0 },
                    { name: "Finishing", cost: 0 }
                ]
            }
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState("LANYARD");
            
            // State HPP
            const [items, setItems] = useState(PRESETS["LANYARD"].components);
            
            // State Penjualan
            const [sellingPrice, setSellingPrice] = useState(0);
            const [qty, setQty] = useState(1);
            const [adminFeePercent, setAdminFeePercent] = useState(6.5);
            
            // State Biaya Tambahan (Custom List)
            const [extraCosts, setExtraCosts] = useState([
                { name: "Biaya Iklan (Ads)", cost: 0 }
            ]);

            // State AI Recommendation
            const [targetMargin, setTargetMargin] = useState(30); // Default target 30% margin

            // --- Handlers Tab & HPP ---
            const handleTabChange = (key) => {
                setActiveTab(key);
                setItems(PRESETS[key].components);
                // Reset simulasi tapi simpan admin fee
                setSellingPrice(0);
            };

            const updateItem = (index, field, value) => {
                const newItems = [...items];
                newItems[index][field] = field === 'cost' ? (parseFloat(value) || 0) : value;
                setItems(newItems);
            };

            const addItem = () => setItems([...items, { name: "Komponen Baru", cost: 0 }]);
            const removeItem = (index) => setItems(items.filter((_, i) => i !== index));

            // --- Handlers Extra Costs (Biaya Tambahan) ---
            const updateExtraCost = (index, field, value) => {
                const newCosts = [...extraCosts];
                newCosts[index][field] = field === 'cost' ? (parseFloat(value) || 0) : value;
                setExtraCosts(newCosts);
            };

            const addExtraCost = () => setExtraCosts([...extraCosts, { name: "Biaya Lainnya", cost: 0 }]);
            const removeExtraCost = (index) => setExtraCosts(extraCosts.filter((_, i) => i !== index));

            // --- CALCULATIONS ---
            const totalHppSatuan = useMemo(() => items.reduce((acc, curr) => acc + curr.cost, 0), [items]);
            const totalHppTotal = totalHppSatuan * qty;

            const totalExtraCostTotal = useMemo(() => extraCosts.reduce((acc, curr) => acc + curr.cost, 0), [extraCosts]);
            
            const totalOmset = sellingPrice * qty;
            const adminFeeNominal = (totalOmset * adminFeePercent) / 100;
            
            const totalBiayaKeluar = totalHppTotal + adminFeeNominal + totalExtraCostTotal;
            const netProfit = totalOmset - totalBiayaKeluar;
            const netProfitSatuan = qty > 0 ? netProfit / qty : 0;
            const marginPercent = totalOmset > 0 ? (netProfit / totalOmset) * 100 : 0;

            // --- AI RECOMMENDATION LOGIC ---
            // Formula: Price = (HPP_Total + ExtraCosts) / (Qty * (1 - Admin% - TargetMargin%))
            // This calculates the price needed to achieve the target margin percentage after all costs.
            const recommendedPrice = useMemo(() => {
                const totalFixedCosts = totalHppTotal + totalExtraCostTotal;
                const adminDec = adminFeePercent / 100;
                const marginDec = targetMargin / 100;
                
                // Avoid division by zero or negative denominator
                const denominator = 1 - adminDec - marginDec;
                
                if (denominator <= 0 || qty <= 0) return 0;
                
                const targetOmset = totalFixedCosts / denominator;
                return targetOmset / qty;
            }, [totalHppTotal, totalExtraCostTotal, qty, adminFeePercent, targetMargin]);

            const applyRecommendation = () => {
                setSellingPrice(Math.ceil(recommendedPrice / 100) * 100); // Round up to nearest 100
            };

            const fmt = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

            return (
                <div className="min-h-screen pb-12">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-indigo-700 to-purple-700 text-white p-6 shadow-lg">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold flex items-center">
                                    <i className="fas fa-chart-line mr-3"></i> OIS Grafika Calculator Pro
                                </h1>
                                <p className="text-indigo-100 text-sm mt-1">Smart HPP & Profit Simulator dengan Rekomendasi Harga</p>
                            </div>
                            <div className="hidden md:block text-right">
                                <span className="bg-white/20 px-3 py-1 rounded-full text-xs font-medium backdrop-blur-sm">
                                    v2.1 AI Powered
                                </span>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto mt-8 px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* LEFT COLUMN (Inputs) */}
                        <div className="lg:col-span-8 space-y-6">
                            
                            {/* 1. Tab Produk */}
                            <div className="glass-panel p-2 rounded-xl card-shadow flex flex-wrap gap-2">
                                {Object.keys(PRESETS).map((key) => (
                                    <button
                                        key={key}
                                        onClick={() => handleTabChange(key)}
                                        className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all flex-1 border ${
                                            activeTab === key 
                                            ? "bg-indigo-600 text-white border-indigo-600 shadow-md" 
                                            : "bg-white text-gray-600 border-gray-200 hover:bg-gray-50"
                                        }`}
                                    >
                                        {PRESETS[key].name.split(" ")[0]}
                                    </button>
                                ))}
                            </div>

                            {/* 2. Komponen HPP */}
                            <div className="bg-white rounded-xl card-shadow overflow-hidden animate-fade-in">
                                <div className="p-4 border-b bg-gray-50 flex justify-between items-center">
                                    <h2 className="font-bold text-gray-700"><i className="fas fa-boxes mr-2 text-indigo-500"></i>Komponen HPP (Bahan Baku)</h2>
                                    <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-bold">Per Satuan</span>
                                </div>
                                <div className="p-4 space-y-3">
                                    {items.map((item, index) => (
                                        <div key={index} className="flex gap-2 items-center">
                                            <button onClick={() => removeItem(index)} className="text-gray-300 hover:text-red-500 px-2 transition">
                                                <i className="fas fa-trash-alt"></i>
                                            </button>
                                            <input 
                                                type="text" 
                                                value={item.name}
                                                onChange={(e) => updateItem(index, 'name', e.target.value)}
                                                className="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                                placeholder="Nama Bahan"
                                            />
                                            <div className="relative w-32 md:w-40">
                                                <span className="absolute left-3 top-2 text-gray-400 text-sm">Rp</span>
                                                <input 
                                                    type="number" 
                                                    value={item.cost}
                                                    onChange={(e) => updateItem(index, 'cost', e.target.value)}
                                                    className="w-full border border-gray-300 rounded pl-8 pr-3 py-2 text-sm text-right font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={addItem} className="mt-2 text-sm text-indigo-600 hover:text-indigo-800 font-medium flex items-center">
                                        <i className="fas fa-plus-circle mr-1"></i> Tambah Bahan Baku
                                    </button>
                                </div>
                                <div className="bg-indigo-50 p-3 flex justify-between items-center px-6">
                                    <span className="text-sm text-indigo-800">Total HPP per Pcs</span>
                                    <span className="font-bold text-lg text-indigo-800">{fmt(totalHppSatuan)}</span>
                                </div>
                            </div>

                            {/* 3. Simulasi & Biaya Tambahan (CUSTOM) */}
                            <div className="bg-white rounded-xl card-shadow overflow-hidden animate-fade-in">
                                <div className="p-4 border-b bg-gray-50">
                                    <h2 className="font-bold text-gray-700"><i className="fas fa-store mr-2 text-green-500"></i>Simulasi Penjualan</h2>
                                </div>
                                <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                                    
                                    {/* Kolom Kiri Simulasi: Harga & Qty */}
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-600 mb-1">Jumlah Order (Qty)</label>
                                            <input 
                                                type="number" 
                                                value={qty}
                                                onChange={(e) => setQty(parseInt(e.target.value) || 1)}
                                                className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-green-500 focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-600 mb-1">Potongan Admin Marketplace (%)</label>
                                            <div className="relative">
                                                <input 
                                                    type="number" 
                                                    step="0.1"
                                                    value={adminFeePercent}
                                                    onChange={(e) => setAdminFeePercent(parseFloat(e.target.value) || 0)}
                                                    className="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-green-500 focus:outline-none"
                                                />
                                                <span className="absolute right-3 top-2 text-gray-400">%</span>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-600 mb-1">Harga Jual (Satuan)</label>
                                            <div className="relative">
                                                <span className="absolute left-3 top-2 text-gray-400">Rp</span>
                                                <input 
                                                    type="number" 
                                                    value={sellingPrice}
                                                    onChange={(e) => setSellingPrice(parseFloat(e.target.value) || 0)}
                                                    className="w-full border-2 border-green-500 rounded pl-8 pr-3 py-2 text-lg font-bold text-gray-800 focus:outline-none"
                                                    placeholder="0"
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    {/* Kolom Kanan Simulasi: Biaya Custom */}
                                    <div className="bg-gray-50 rounded-lg p-4 border border-gray-200">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-sm font-bold text-gray-700">Biaya Tambahan (Total)</label>
                                            <button onClick={addExtraCost} className="text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-600 transition">
                                                <i className="fas fa-plus"></i> Tambah
                                            </button>
                                        </div>
                                        <p className="text-xs text-gray-400 mb-3">Contoh: Ongkir, Packing Kayu, Tips, Iklan.</p>
                                        
                                        <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                                            {extraCosts.map((cost, index) => (
                                                <div key={index} className="flex gap-2">
                                                    <input 
                                                        type="text" 
                                                        value={cost.name}
                                                        onChange={(e) => updateExtraCost(index, 'name', e.target.value)}
                                                        className="flex-1 border border-gray-300 rounded px-2 py-1 text-xs"
                                                        placeholder="Nama Biaya"
                                                    />
                                                    <div className="relative w-24">
                                                        <input 
                                                            type="number" 
                                                            value={cost.cost}
                                                            onChange={(e) => updateExtraCost(index, 'cost', e.target.value)}
                                                            className="w-full border border-gray-300 rounded px-2 py-1 text-xs text-right"
                                                        />
                                                    </div>
                                                    <button onClick={() => removeExtraCost(index)} className="text-gray-400 hover:text-red-500">
                                                        <i className="fas fa-times"></i>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="mt-3 flex justify-between items-center text-sm border-t pt-2 border-gray-200">
                                            <span className="text-gray-600">Total Ekstra:</span>
                                            <span className="font-bold text-gray-800">{fmt(totalExtraCostTotal)}</span>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN (Analysis & AI) */}
                        <div className="lg:col-span-4 space-y-6">
                            
                            {/* 4. AI Recommendation Panel */}
                            <div className="bg-gradient-to-br from-purple-600 to-indigo-800 rounded-xl card-shadow p-6 text-white relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-10">
                                    <i className="fas fa-robot text-6xl"></i>
                                </div>
                                <h3 className="font-bold text-lg mb-1 flex items-center">
                                    <i className="fas fa-magic mr-2 text-yellow-300"></i> Rekomendasi Harga
                                </h3>
                                <p className="text-purple-200 text-xs mb-4">Tentukan target margin, AI hitung harga ideal.</p>

                                <div className="flex items-center gap-3 mb-4">
                                    <span className="text-sm">Target Margin:</span>
                                    <div className="relative w-20">
                                        <input 
                                            type="number" 
                                            value={targetMargin}
                                            onChange={(e) => setTargetMargin(parseFloat(e.target.value) || 0)}
                                            className="w-full bg-white/20 border border-white/30 rounded px-2 py-1 text-center font-bold focus:outline-none"
                                        />
                                        <span className="absolute right-1 top-1 text-xs">%</span>
                                    </div>
                                </div>

                                <div className="bg-black/20 rounded-lg p-3 text-center mb-4 backdrop-blur-sm border border-white/10">
                                    <div className="text-xs text-purple-200 uppercase">Saran Harga Jual</div>
                                    <div className="text-2xl font-bold text-yellow-300 shadow-sm">
                                        {recommendedPrice > 0 && isFinite(recommendedPrice) ? fmt(Math.ceil(recommendedPrice/100)*100) : "Rp 0"}
                                    </div>
                                    <div className="text-[10px] text-purple-300 mt-1">
                                        (Sudah cover HPP, Admin {adminFeePercent}%, Biaya Ekstra)
                                    </div>
                                </div>

                                <button 
                                    onClick={applyRecommendation}
                                    className="w-full bg-white text-indigo-700 py-2 rounded-lg font-bold text-sm hover:bg-indigo-50 transition shadow-lg"
                                >
                                    Gunakan Harga Ini
                                </button>
                            </div>

                            {/* 5. Analisa Profit (Sticky) */}
                            <div className="bg-white rounded-xl card-shadow sticky top-6 overflow-hidden">
                                <div className="bg-gray-800 text-white p-4 text-center">
                                    <h2 className="font-bold text-lg">Analisa Keuntungan</h2>
                                </div>
                                <div className="p-5 space-y-4">
                                    
                                    {/* Breakdown Mini */}
                                    <div className="space-y-2 text-sm">
                                        <div className="flex justify-between">
                                            <span className="text-gray-500">Omset Penjualan</span>
                                            <span className="font-bold text-gray-800">{fmt(totalOmset)}</span>
                                        </div>
                                        <div className="flex justify-between text-red-500">
                                            <span>(-) Total HPP</span>
                                            <span>-{fmt(totalHppTotal)}</span>
                                        </div>
                                        <div className="flex justify-between text-red-500">
                                            <span>(-) Admin Marketplace</span>
                                            <span>-{fmt(adminFeeNominal)}</span>
                                        </div>
                                        <div className="flex justify-between text-red-500">
                                            <span>(-) Biaya Tambahan</span>
                                            <span>-{fmt(totalExtraCostTotal)}</span>
                                        </div>
                                        <hr className="border-dashed my-2"/>
                                    </div>

                                    {/* Big Result */}
                                    <div className={`text-center p-4 rounded-xl border-2 transition-all ${
                                        netProfit > 0 ? 'bg-green-50 border-green-200' : 
                                        netProfit < 0 ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-gray-200'
                                    }`}>
                                        <div className="text-gray-500 text-xs font-bold uppercase mb-1">Profit Bersih</div>
                                        <div className={`text-2xl font-extrabold ${
                                            netProfit > 0 ? 'text-green-600' : netProfit < 0 ? 'text-red-600' : 'text-gray-600'
                                        }`}>
                                            {fmt(netProfit)}
                                        </div>
                                        {qty > 1 && (
                                            <div className="text-xs text-gray-500 mt-1">
                                                {fmt(netProfitSatuan)} / pcs
                                            </div>
                                        )}
                                    </div>

                                    {/* Margin Indicator */}
                                    <div className="flex items-center justify-between bg-gray-100 p-3 rounded-lg">
                                        <div className="text-xs font-bold text-gray-600">MARGIN PROFIT</div>
                                        <div className={`text-lg font-bold ${
                                            marginPercent < 15 ? 'text-red-500' : 
                                            marginPercent < 30 ? 'text-yellow-600' : 'text-green-600'
                                        }`}>
                                            {marginPercent.toFixed(1)}%
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
